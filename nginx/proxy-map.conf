# Accept the HTTPS signal only from a local tunnel for the two configured domains (filled in by tools/render_nginx.py).
map "$remote_addr|$host|$http_x_forwarded_proto" $sgr_v3_secure {
    default 0;
    "127.0.0.1|@STUDENT_DOMAIN@|https" 1;
    "127.0.0.1|@TEACHER_DOMAIN@|https" 1;
    "::1|@STUDENT_DOMAIN@|https" 1;
    "::1|@TEACHER_DOMAIN@|https" 1;
}

map "$remote_addr|$host|$http_x_forwarded_proto" $sgr_v3_https_base {
    default "";
    "127.0.0.1|@STUDENT_DOMAIN@|http" https://@STUDENT_DOMAIN@;
    "127.0.0.1|@TEACHER_DOMAIN@|http" https://@TEACHER_DOMAIN@;
    "::1|@STUDENT_DOMAIN@|http" https://@STUDENT_DOMAIN@;
    "::1|@TEACHER_DOMAIN@|http" https://@TEACHER_DOMAIN@;
}
