; Managed by SGR Library V3
[sgr-library-v3]
user = sgr-library
group = sgr-library
listen = /run/php/sgr-library-v3.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 16
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
clear_env = yes
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/sgr-library-v3/php.log
php_admin_value[date.timezone] = Asia/Bangkok
php_admin_value[upload_max_filesize] = 8M
php_admin_value[post_max_size] = 10M
php_admin_value[upload_tmp_dir] = /var/lib/sgr-library-v3/tmp
php_admin_value[session.save_path] = /var/lib/sgr-library-v3/sessions
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor] = 1000
